name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 = exact minimum (first 22.x with require() of ES modules by default),
        # 24 = current LTS, 26 = next LTS. Catches dependencies that silently raise the minimum.
        node: ['22.12.0', '24', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  node-gate:
    name: Blokada zbyt starego Node (22.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.11.0'
      # Without require(esm) the toolchain fails with a cryptic ERR_REQUIRE_ESM; npm ci must
      # stop with the Polish instructions from scripts/check-node.mjs instead.
      - name: npm ci stops with instructions
        run: |
          if npm ci > npm-ci.log 2>&1; then cat npm-ci.log; echo "npm ci should fail on Node 22.11"; exit 1; fi
          grep -q "jest za stary" npm-ci.log

  windows:
    name: Build exe + smoke test (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # An outdated system Node.js (like on the user's PC): build-windows.cmd must not depend on it.
      - uses: actions/setup-node@v5
        with:
          node-version: '20.12.0'
          cache: npm
      # The one-click build users run: pinned Node.js from .node-version downloaded into .tools\,
      # npm ci, unit + filesystem tests on real NTFS, portable + installer.
      - name: build-windows.cmd
        shell: cmd
        run: build-windows.cmd
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Smoke test of the packaged app
        run: npx playwright test
        env:
          ICTJ_E2E_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\ICT Trade Journal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ICT-Trade-Journal-windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-zrzuty-windows
          path: test-results/
          retention-days: 7
