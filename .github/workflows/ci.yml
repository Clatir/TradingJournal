name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Build exe + smoke test (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit + filesystem tests on real NTFS (atomic rename, recursive watcher, recycle-bin-free deletes).
      - run: npm test
      - name: Build portable + installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test of the packaged app
        run: npx playwright test
        env:
          ICTJ_E2E_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\ICT Trade Journal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ICT-Trade-Journal-windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-zrzuty-windows
          path: test-results/
          retention-days: 7
